<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC DCA Ledger</title>
<style>
  :root{
    --bg:#0B0E11; --panel:#12161C; --panel2:#171C24; --line:#242A33;
    --ink:#E9EAEC; --ink-dim:#8B93A0; --gold:#F0B90B; --gold-dim:#8a6b0a;
    --green:#3FBE85; --red:#E5484D;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:600;margin:0}
  h1 span{color:var(--gold)}
  .sub{color:var(--ink-dim);font-size:12.5px;margin:3px 0 22px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
  .stat{background:var(--panel);padding:14px 16px}
  .stat .l{color:var(--ink-dim);font-size:11.5px;margin-bottom:6px}
  .stat .v{font-size:19px;font-weight:600}
  .v.pos{color:var(--green)} .v.neg{color:var(--red)}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:16px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:12.5px;color:var(--ink-dim);margin:0 0 12px;font-weight:600}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:13.5px;margin-bottom:8px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  label{display:block;font-size:11px;color:var(--ink-dim);margin-bottom:3px}
  button{background:var(--gold);color:#151200;border:none;border-radius:8px;font-weight:600;font-size:13px;padding:9px 14px;cursor:pointer;width:100%}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:right;color:var(--ink-dim);font-weight:500;font-size:11px;padding:0 8px 8px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
  tr:last-child td{border-bottom:none}
  .del{color:var(--ink-dim);cursor:pointer;font-size:14px;padding:0 4px}
  .del:hover{color:var(--red)}
  .empty{color:var(--ink-dim);font-size:13px;text-align:center;padding:30px 10px}
  svg{width:100%;height:110px;display:block}
  .synced{color:var(--ink-dim);font-size:11.5px}
  .pending{color:var(--gold);font-size:11px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>BTC DCA <span>Ledger</span></h1>
    </div>
  </header>
  <div class="sub" id="syncedLine">กำลังโหลดข้อมูล…</div>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>เพิ่มรายการด่วน (ยังไม่ sync)</h2>
        <div class="row2">
          <div><label>ใช้ (THB)</label><input id="mSpent" type="number" step="any"></div>
          <div><label>ราคา (THB/BTC)</label><input id="mPrice" type="number" step="any"></div>
        </div>
        <div class="row2">
          <div><label>ได้ (BTC)</label><input id="mBtc" type="number" step="any" placeholder="auto"></div>
          <div><label>เวลา</label><input id="mTime" type="datetime-local"></div>
        </div>
        <button id="addBtn">เพิ่ม</button>
        <div style="margin-top:8px;font-size:11px;color:var(--ink-dim)">รายการนี้จะถูกแทนที่ด้วยข้อมูลจริงจาก Bitkub เมื่อ sync รอบถัดไปทำงาน</div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>ราคา BTC ปัจจุบัน (THB) — สำหรับ P&amp;L</h2>
        <input id="curPrice" type="number" step="any">
        <button class="ghost" id="saveCur">อัปเดต</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>ประวัติการซื้อ</h2>
        <div id="tableWrap"></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h2>ราคาที่ซื้อในแต่ละครั้ง</h2>
        <svg id="chart" viewBox="0 0 600 110" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </div>
</div>

<script>
const LS_LOCAL = 'btc_dca_local_entries_v1';
const LS_CUR = 'btc_dca_curprice_v1';

function loadLocal(){ try{ return JSON.parse(localStorage.getItem(LS_LOCAL)||'[]'); }catch(e){ return []; } }
function saveLocal(list){ try{ localStorage.setItem(LS_LOCAL, JSON.stringify(list)); }catch(e){} }
function loadCur(){ try{ return parseFloat(localStorage.getItem(LS_CUR)) || null; }catch(e){ return null; } }
function saveCur(v){ try{ localStorage.setItem(LS_CUR, String(v)); }catch(e){} }

let synced = { entries: [], last_synced: null };
let local = loadLocal();
let curPrice = loadCur();
if(curPrice) document.getElementById('curPrice').value = curPrice;

function fmt(n,d=0){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }

async function loadSynced(){
  try{
    const res = await fetch('./data/orders.json', {cache:'no-store'});
    if(res.ok) synced = await res.json();
  }catch(e){ /* file may not exist yet on first deploy */ }
  render();
}

document.getElementById('addBtn').onclick = () => {
  const spent = parseFloat(document.getElementById('mSpent').value);
  const price = parseFloat(document.getElementById('mPrice').value);
  let btc = parseFloat(document.getElementById('mBtc').value);
  const timeInput = document.getElementById('mTime').value;
  if(isNaN(spent) || isNaN(price)) return;
  if(isNaN(btc)) btc = spent/price;
  const time = timeInput ? new Date(timeInput).toISOString() : new Date().toISOString();
  local.push({id:'local-'+Date.now(), spent, price, btc, time, side:'buy'});
  saveLocal(local);
  ['mSpent','mPrice','mBtc','mTime'].forEach(id=>document.getElementById(id).value='');
  render();
};

document.getElementById('saveCur').onclick = () => {
  const v = parseFloat(document.getElementById('curPrice').value);
  if(!isNaN(v)){ curPrice = v; saveCur(v); render(); }
};

function removeLocal(id){
  local = local.filter(e=>e.id!==id);
  saveLocal(local);
  render();
}

function allEntries(){
  return [...synced.entries, ...local].sort((a,b)=> new Date(a.time)-new Date(b.time));
}

function renderStats(){
  const entries = allEntries();
  const totalSpent = entries.reduce((a,e)=>a+(e.spent||0),0);
  const totalBtc = entries.reduce((a,e)=>a+(e.btc||0),0);
  const avgCost = totalBtc ? totalSpent/totalBtc : null;
  const curVal = (curPrice && totalBtc) ? totalBtc*curPrice : null;
  const pnl = curVal!==null ? curVal-totalSpent : null;

  const cells = [
    ['ลงทุนสะสม','THB '+fmt(totalSpent),''],
    ['BTC สะสม',fmt(totalBtc,8),''],
    ['ต้นทุนเฉลี่ย',avgCost?'THB '+fmt(avgCost):'—',''],
    ['จำนวนครั้ง',entries.length,''],
    ['มูลค่าปัจจุบัน',curVal!==null?'THB '+fmt(curVal):'—',''],
    ['กำไร/ขาดทุน',pnl!==null?(pnl>=0?'+':'')+'THB '+fmt(pnl):'—',pnl!==null?(pnl>=0?'pos':'neg'):''],
  ];
  document.getElementById('stats').innerHTML = cells.map(([l,v,cls])=>
    `<div class="stat"><div class="l">${l}</div><div class="v num ${cls}">${v}</div></div>`).join('');

  const syncedLine = document.getElementById('syncedLine');
  syncedLine.textContent = synced.last_synced
    ? 'ซิงก์ล่าสุดจาก Bitkub: ' + new Date(synced.last_synced).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})
    : 'ยังไม่มีข้อมูล sync (รอ GitHub Actions รันรอบแรก)';
}

function renderTable(){
  const wrap = document.getElementById('tableWrap');
  const entries = allEntries();
  if(!entries.length){ wrap.innerHTML = '<div class="empty">ยังไม่มีรายการซื้อ</div>'; return; }
  const sorted = [...entries].sort((a,b)=> new Date(b.time)-new Date(a.time));
  const rows = sorted.map(e => `
    <tr>
      <td>${new Date(e.time).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}${e.id && String(e.id).startsWith('local-') ? '<span class="pending">รอ sync</span>' : ''}</td>
      <td class="num">${fmt(e.spent)}</td>
      <td class="num">${fmt(e.price)}</td>
      <td class="num">${fmt(e.btc,8)}</td>
      <td>${String(e.id).startsWith('local-') ? `<span class="del" onclick="removeLocal('${e.id}')">✕</span>` : ''}</td>
    </tr>`).join('');
  wrap.innerHTML = `<table><thead><tr><th>เวลา</th><th>ใช้ (THB)</th><th>ราคา</th><th>ได้ (BTC)</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderChart(){
  const svg = document.getElementById('chart');
  const entries = allEntries();
  if(!entries.length){ svg.innerHTML=''; return; }
  const prices = entries.map(e=>e.price).filter(p=>p!=null);
  if(!prices.length){ svg.innerHTML=''; return; }
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = (max-min) || 1;
  const w=600,h=110,pad=8;
  const pts = prices.map((p,i)=>{
    const x = prices.length>1 ? pad + i*(w-2*pad)/(prices.length-1) : w/2;
    const y = h-pad - ((p-min)/range)*(h-2*pad);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="#F0B90B"/>`).join('');
  svg.innerHTML = `<path d="${path}" fill="none" stroke="#F0B90B" stroke-width="1.5" opacity="0.85"/>${dots}`;
}

function render(){ renderStats(); renderTable(); renderChart(); }
loadSynced();
</script>
</body>
</html>
