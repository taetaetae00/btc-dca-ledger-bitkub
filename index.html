<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC DCA Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#faf9f5; --surface-card:#efe9de; --surface-cream-strong:#e8e0d2;
    --surface-dark:#181715; --surface-dark-soft:#1f1e1b; --surface-dark-elevated:#252320;
    --ink:#141413; --body:#3d3d3a; --muted:#6c6a64; --muted-soft:#8e8b82;
    --hairline:#e6dfd8; --primary:#cc785c; --primary-active:#a9583e;
    --on-dark:#faf9f5; --on-dark-soft:#a09d96;
    --success:#5db872; --error:#c64545;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .serif{font-family:'Fraunces',Georgia,serif}
  .wrap{max-width:1080px;margin:0 auto;padding:48px 24px 64px}
  header h1{
    font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:36px;
    letter-spacing:-0.5px; margin:0 0 6px; color:var(--ink);
  }
  header h1 em{color:var(--primary); font-style:normal}
  .sub{color:var(--muted); font-size:14px}

  .stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:1px; background:var(--hairline); border:1px solid var(--hairline);
    border-radius:12px; overflow:hidden; margin:28px 0 24px;
  }
  .stat{background:var(--surface-card); padding:18px 18px}
  .stat .l{color:var(--muted); font-size:12px; margin-bottom:8px}
  .stat .v{font-size:20px; font-weight:500}
  .stat .v2{font-size:13px; color:var(--muted-soft); margin-top:2px}
  .stat .v.pos{color:var(--success)} .stat .v.neg{color:var(--error)}

  .grid{display:grid; grid-template-columns:320px 1fr; gap:20px}
  @media (max-width:800px){.grid{grid-template-columns:1fr}}

  .card{background:var(--canvas); border:1px solid var(--hairline); border-radius:12px; padding:22px}
  .card h2{font-size:13px; color:var(--muted); margin:0 0 14px; font-weight:500; letter-spacing:.2px}

  input{
    width:100%; background:var(--canvas); border:1px solid var(--hairline);
    color:var(--ink); border-radius:8px; padding:10px 12px; font-size:14px;
    font-family:inherit; margin-bottom:10px;
  }
  input:focus{outline:none; border-color:var(--primary)}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  label{display:block; font-size:11px; color:var(--muted-soft); margin-bottom:4px}

  button{
    background:var(--primary); color:#fff; border:none; border-radius:8px;
    font-weight:500; font-size:14px; padding:11px 16px; cursor:pointer; width:100%;
  }
  button:hover{background:var(--primary-active)}
  button.ghost{background:var(--surface-card); color:var(--ink); font-weight:500}
  .hint{margin-top:8px; font-size:11.5px; color:var(--muted-soft); line-height:1.5}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{text-align:right; color:var(--muted); font-weight:500; font-size:11px; padding:0 10px 10px; border-bottom:1px solid var(--hairline)}
  th:first-child, td:first-child{text-align:left}
  td{padding:10px; border-bottom:1px solid var(--hairline); text-align:right}
  tr:last-child td{border-bottom:none}
  .del{color:var(--muted-soft); cursor:pointer; font-size:14px; padding:0 4px}
  .del:hover{color:var(--error)}
  .empty{color:var(--muted-soft); font-size:13px; text-align:center; padding:36px 10px}
  .pending{color:var(--primary); font-size:10.5px; margin-left:6px}
  .usd{color:var(--muted-soft); font-size:11.5px}

  .chart-card{
    margin-top:20px; background:var(--surface-dark); border-radius:12px;
    padding:22px; color:var(--on-dark);
  }
  .chart-card h2{color:var(--on-dark-soft)}
  .chart-legend{display:flex; gap:16px; font-size:11.5px; color:var(--on-dark-soft); margin-top:8px}
  svg{width:100%; height:180px; display:block; overflow:visible}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BTC DCA <em>Ledger</em></h1>
    <div class="sub" id="syncedLine">กำลังโหลดข้อมูล…</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>เพิ่มรายการด่วน (ยังไม่ sync)</h2>
        <div class="row2">
          <div><label>ใช้ (THB)</label><input id="mSpent" type="number" step="any"></div>
          <div><label>ราคา (THB/BTC)</label><input id="mPrice" type="number" step="any"></div>
        </div>
        <div class="row2">
          <div><label>ได้ (BTC)</label><input id="mBtc" type="number" step="any" placeholder="auto"></div>
          <div><label>เวลา</label><input id="mTime" type="datetime-local"></div>
        </div>
        <button id="addBtn">เพิ่ม</button>
        <div class="hint">รายการนี้จะถูกแทนที่ด้วยข้อมูลจริงจาก Bitkub เมื่อ sync รอบถัดไปทำงาน</div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>ราคา BTC ปัจจุบัน (THB) — สำหรับ P&amp;L</h2>
        <input id="curPrice" type="number" step="any">
        <button class="ghost" id="saveCur">อัปเดต</button>
        <div class="hint" id="fxLine"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>ประวัติการซื้อ</h2>
        <div id="tableWrap"></div>
      </div>

      <div class="chart-card">
        <h2>ราคาที่ซื้อในแต่ละครั้ง</h2>
        <svg id="chart" viewBox="0 0 640 180" preserveAspectRatio="none">
          <defs>
            <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#cc785c" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#cc785c" stop-opacity="0"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="chart-legend"><span>● ราคาต่อ BTC (THB)</span></div>
      </div>
    </div>
  </div>
</div>

<script>
const LS_LOCAL = 'btc_dca_local_entries_v1';
const LS_CUR = 'btc_dca_curprice_v1';
const LS_FX = 'btc_dca_fx_thb_usd_v1';

function loadLocal(){ try{ return JSON.parse(localStorage.getItem(LS_LOCAL)||'[]'); }catch(e){ return []; } }
function saveLocal(list){ try{ localStorage.setItem(LS_LOCAL, JSON.stringify(list)); }catch(e){} }
function loadCur(){ try{ return parseFloat(localStorage.getItem(LS_CUR)) || null; }catch(e){ return null; } }
function saveCur(v){ try{ localStorage.setItem(LS_CUR, String(v)); }catch(e){} }

let synced = { entries: [], last_synced: null };
let local = loadLocal();
let curPrice = loadCur();
let fxRate = null; // THB -> USD
if(curPrice) document.getElementById('curPrice').value = curPrice;

function fmt(n,d=0){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function usd(thb){ if(fxRate==null || thb==null || isNaN(thb)) return ''; return '$'+fmt(thb*fxRate,2); }

async function loadFx(){
  try{
    const cached = JSON.parse(localStorage.getItem(LS_FX)||'null');
    if(cached && Date.now() - cached.t < 6*60*60*1000){ fxRate = cached.rate; return; }
    const res = await fetch('https://api.frankfurter.dev/v1/latest?base=THB&symbols=USD');
    const data = await res.json();
    if(data && data.rates && data.rates.USD){
      fxRate = data.rates.USD;
      localStorage.setItem(LS_FX, JSON.stringify({rate: fxRate, t: Date.now()}));
    }
  }catch(e){ /* offline or blocked — THB-only fallback */ }
}

async function loadSynced(){
  try{
    const res = await fetch('./data/orders.json', {cache:'no-store'});
    if(res.ok) synced = await res.json();
  }catch(e){ }
  render();
}

document.getElementById('addBtn').onclick = () => {
  const spent = parseFloat(document.getElementById('mSpent').value);
  const price = parseFloat(document.getElementById('mPrice').value);
  let btc = parseFloat(document.getElementById('mBtc').value);
  const timeInput = document.getElementById('mTime').value;
  if(isNaN(spent) || isNaN(price)) return;
  if(isNaN(btc)) btc = spent/price;
  const time = timeInput ? new Date(timeInput).toISOString() : new Date().toISOString();
  local.push({id:'local-'+Date.now(), spent, price, btc, time, side:'buy'});
  saveLocal(local);
  ['mSpent','mPrice','mBtc','mTime'].forEach(id=>document.getElementById(id).value='');
  render();
};

document.getElementById('saveCur').onclick = () => {
  const v = parseFloat(document.getElementById('curPrice').value);
  if(!isNaN(v)){ curPrice = v; saveCur(v); render(); }
};

function removeLocal(id){
  local = local.filter(e=>e.id!==id);
  saveLocal(local);
  render();
}

function allEntries(){
  return [...synced.entries, ...local].sort((a,b)=> new Date(a.time)-new Date(b.time));
}

function renderStats(){
  const entries = allEntries();
  const totalSpent = entries.reduce((a,e)=>a+(e.spent||0),0);
  const totalBtc = entries.reduce((a,e)=>a+(e.btc||0),0);
  const avgCost = totalBtc ? totalSpent/totalBtc : null;
  const curVal = (curPrice && totalBtc) ? totalBtc*curPrice : null;
  const pnl = curVal!==null ? curVal-totalSpent : null;

  const cells = [
    ['ลงทุนสะสม', 'THB '+fmt(totalSpent), usd(totalSpent), ''],
    ['BTC สะสม', fmt(totalBtc,8), '', ''],
    ['ต้นทุนเฉลี่ย', avgCost?'THB '+fmt(avgCost):'—', avgCost?usd(avgCost):'', ''],
    ['จำนวนครั้ง', entries.length, '', ''],
    ['มูลค่าปัจจุบัน', curVal!==null?'THB '+fmt(curVal):'—', curVal!==null?usd(curVal):'', ''],
    ['กำไร/ขาดทุน', pnl!==null?(pnl>=0?'+':'')+'THB '+fmt(pnl):'—', pnl!==null?usd(Math.abs(pnl)):'', pnl!==null?(pnl>=0?'pos':'neg'):''],
  ];
  document.getElementById('stats').innerHTML = cells.map(([l,v,v2,cls])=>
    `<div class="stat"><div class="l">${l}</div><div class="v mono ${cls}">${v}</div>${v2?`<div class="v2 mono">${v2}</div>`:''}</div>`).join('');

  const syncedLine = document.getElementById('syncedLine');
  syncedLine.textContent = synced.last_synced
    ? 'ซิงก์ล่าสุดจาก Bitkub: ' + new Date(synced.last_synced).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})
    : 'ยังไม่มีข้อมูล sync (รอ GitHub Actions รันรอบแรก)';

  document.getElementById('fxLine').textContent = fxRate
    ? `อัตราแลกเปลี่ยนอ้างอิง: 1 THB ≈ $${fxRate.toFixed(5)}`
    : '';
}

function renderTable(){
  const wrap = document.getElementById('tableWrap');
  const entries = allEntries();
  if(!entries.length){ wrap.innerHTML = '<div class="empty">ยังไม่มีรายการซื้อ</div>'; return; }
  const sorted = [...entries].sort((a,b)=> new Date(b.time)-new Date(a.time));
  const rows = sorted.map(e => `
    <tr>
      <td>${new Date(e.time).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}${String(e.id).startsWith('local-') ? '<span class="pending">รอ sync</span>' : ''}</td>
      <td class="mono">${fmt(e.spent)}<div class="usd mono">${usd(e.spent)}</div></td>
      <td class="mono">${fmt(e.price)}<div class="usd mono">${usd(e.price)}</div></td>
      <td class="mono">${fmt(e.btc,8)}</td>
      <td>${String(e.id).startsWith('local-') ? `<span class="del" onclick="removeLocal('${e.id}')">✕</span>` : ''}</td>
    </tr>`).join('');
  wrap.innerHTML = `<table><thead><tr><th>เวลา</th><th>ใช้ (THB)</th><th>ราคา</th><th>ได้ (BTC)</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderChart(){
  const svg = document.getElementById('chart');
  const entries = allEntries();
  const prices = entries.map(e=>e.price).filter(p=>p!=null);
  if(!prices.length){ svg.innerHTML=''; return; }
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = (max-min) || 1;
  const w=640,h=180,padT=14,padB=14;
  const pts = prices.map((p,i)=>{
    const x = prices.length>1 ? i*w/(prices.length-1) : w/2;
    const y = h-padB - ((p-min)/range)*(h-padT-padB);
    return [x,y];
  });
  // smooth path via quadratic mid-points
  let path = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
    const mx=(x0+x1)/2;
    path += ` Q${x0.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${((y0+y1)/2).toFixed(1)}`;
  }
  path += ` T${pts[pts.length-1][0].toFixed(1)},${pts[pts.length-1][1].toFixed(1)}`;
  const areaPath = `${path} L${pts[pts.length-1][0].toFixed(1)},${h} L0,${h} Z`;

  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + f*(h-padT-padB);
    return `<line x1="0" y1="${y.toFixed(1)}" x2="${w}" y2="${y.toFixed(1)}" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>`;
  }).join('');

  const dots = pts.map((p,i)=> i===pts.length-1
    ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#cc785c"/>`
    : `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="#cc785c" opacity="0.7"/>`
  ).join('');

  svg.innerHTML = `
    <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cc785c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cc785c" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#areaFill)" stroke="none"/>
    <path d="${path}" fill="none" stroke="#cc785c" stroke-width="2"/>
    ${dots}
  `;
}

function render(){ renderStats(); renderTable(); renderChart(); }

(async function init(){
  await loadFx();
  await loadSynced();
})();
</script>
</body>
</html>
